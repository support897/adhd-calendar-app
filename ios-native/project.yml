name: Pace
options:
  bundleIdPrefix: shop.ilseplacencia
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: 5.0.0
targets:
  PaceCalendar:
    type: application
    platform: iOS
    sources:
      - path: Sources/PaceCalendar
      - path: Sources/Shared
    info:
      path: Sources/PaceCalendar/Info.plist
      properties:
        CFBundleDisplayName: Pace Calendar
        UILaunchScreen: {}
        UIAppFonts:
          - BricolageGrotesque.ttf
          - Manrope.ttf
        CFBundleURLTypes:
          - CFBundleURLName: shop.ilseplacencia.pace.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1098367119523-jbv8v9u86v1dp91hjdi8oi8t0d3laem8
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: Pace keeps your events in your Apple calendar too, so your day stands in both places.
        NSSpeechRecognitionUsageDescription: Pace turns your voice into events on this device, so you can just say what is on.
        NSMicrophoneUsageDescription: Pace listens only while you hold the talk button, to write down what you say.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shop.ilseplacencia.pace
        PRODUCT_NAME: PaceCalendar
        CODE_SIGN_ENTITLEMENTS: Sources/PaceCalendar/Pace.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: PaceWidgets
      - target: PaceWatch
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: RevenueCat
        product: RevenueCat
  PaceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/PaceWidgets
      - path: Sources/Shared
    info:
      path: Sources/PaceWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pace
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shop.ilseplacencia.pace.widgets
        CODE_SIGN_ENTITLEMENTS: Sources/PaceWidgets/Pace.widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: "YES"
  PaceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/PaceWatch
    info:
      path: Sources/PaceWatch/Info.plist
      properties:
        CFBundleDisplayName: Pace
        WKCompanionAppBundleIdentifier: shop.ilseplacencia.pace
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shop.ilseplacencia.pace.watchkitapp
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  PaceCalendarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/PaceCalendarUITests
    # 2026-11-15: a real Info.plist, generated by XcodeGen like the app
    # target's. Cloud run 3's cause: the cloud tree's test target
    # carried NO Info.plist provision at all — the
    # GENERATE_INFOPLIST_FILE line stood only in the desk copy of
    # project.yml (a parity miss, corrected the same night) — so the
    # ad-hoc signed test bundle refused to code sign ("does not have
    # an Info.plist file") and zero tests ran. The app target's shape
    # (info block -> INFOPLIST_FILE) signs fine in both lanes.
    info:
      path: Tests/PaceCalendarUITests/Info.plist
      properties:
        CFBundleDisplayName: PaceCalendarUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: shop.ilseplacencia.pace.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PaceCalendar
schemes:
  Pace:
    build:
      targets:
        PaceCalendar: all
        PaceCalendarUITests: [test]
    test:
      targets:
        - PaceCalendarUITests
      gatherCoverageData: false
